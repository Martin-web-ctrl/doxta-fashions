<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOXA DRESSES | Luxury Dress Hire</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>

    <!-- Animated Satin Silk Background Layer -->
    <div class="satin-background">
        <div class="silk-wave wave-1"></div>
        <div class="silk-wave wave-2"></div>
    </div>

    <!-- Main Container -->
    <main class="page-container">
        
        <!-- Hero Header: Logo & Tagline -->
        <header class="hero-header">
            <div class="logo-wrapper floating-animation">
                <img src="assets/doxta logo.png" alt="DOXTA DRESSES Logo" class="brand-logo">
            </div>
            <p class="tagline">Luxury Dress Hire</p>
        </header>

        <!-- Glassmorphism Card Container -->
        <section class="glass-card">
            
            <!-- Welcome Text -->
            <div class="welcome-content">
                <h1 class="welcome-title">Welcome to DOXTA DRESSES</h1>
                <p class="welcome-subtitle">Luxury styles for every special moment.</p>
                <div class="divider">
                    <span class="diamond-icon">✦</span>
                </div>
            </div>

            <!-- Social Links Stack -->
            <div class="social-links-stack">
                
                <!-- Instagram Button (Jet Black Glass) -->
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="glass-btn btn-black tap-effect">
                    <div class="btn-shine"></div>
                    <div class="btn-content-left">
                        <div class="icon-circle">
                            <img src="assets/instagram.png" alt="Instagram" class="social-icon">
                        </div>
                        <div class="btn-text-group">
                            <span class="btn-label-top">Follow us on</span>
                            <span class="btn-label-main">INSTAGRAM</span>
                        </div>
                    </div>
                    <div class="arrow-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </div>
                </a>

                <!-- TikTok Button (Frosted White Glass) -->
                <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer" class="glass-btn btn-white tap-effect">
                    <div class="btn-shine"></div>
                    <div class="btn-content-left">
                        <div class="icon-circle light-circle">
                            <img src="assets/tiktok.png" alt="TikTok" class="social-icon">
                        </div>
                        <div class="btn-text-group">
                            <span class="btn-label-top">Follow us on</span>
                            <span class="btn-label-main">TIKTOK</span>
                        </div>
                    </div>
                    <div class="arrow-icon dark-arrow">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </div>
                </a>

            </div>

        </section>

        <!-- Elegant Footer Capsule -->
        <footer class="footer-capsule">
            <div class="footer-heart">♥</div>
            <p class="footer-text">Thank you for supporting local & luxury.</p>
            <p class="footer-copy">&copy; DOXTA DRESSES</p>
        </footer>

    </main>

    <!-- Vanilla JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
